version: "3"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OWL_SERVE_HOST: "0.0.0.0"
      OWL_DB_PATH: "/app/data/owl.db"
    ports:
      - "${OWL_SERVE_PORT:-8000}:8000"
    volumes:
      - owl_data:/app/data

volumes:
  owl_data:
